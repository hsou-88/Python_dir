[project]
name = "module-05-biss"
version = "0.1.0"
description = "Python learning exercises"
readme = "README.md"
authors = [
    { name = "hsou-88", email = "sen10.d.g@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
module-05-biss = "module_05_biss:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["flake8", "mypy"]

[tool.mypy]
python_version = "3.10"
strict = true
sqlite_cache = false
explicit_package_bases = true
mypy_path = "src/module_05_biss"
